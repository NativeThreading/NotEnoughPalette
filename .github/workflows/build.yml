name: build

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  # A tag can be pushed from any commit on any branch. Only tags that point at a
  # commit reachable from main are releasable, so that a tag on dev (or a stray
  # commit) can never publish a release.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      publishable: ${{ steps.check.outputs.publishable }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        id: check
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "publishable=true" >> "${GITHUB_OUTPUT}"
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is reachable from main."
          else
            echo "publishable=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from main; skipping publish."
          fi

  publish:
    needs: [build, verify-tag]
    if: needs.verify-tag.outputs.publishable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The job condition above already gates this, but re-check before anything
      # is uploaded so a mistake there fails closed instead of publishing.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from main; refusing to publish."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew assemble

      - name: Determine release type
        id: release
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == 0.* ]] || echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-alpha'; then
            echo "type=alpha" >> $GITHUB_OUTPUT
          elif echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-beta'; then
            echo "type=beta" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: wupAPOwH
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ steps.release.outputs.type }}
          github-generate-changelog: true
          game-versions: 26.3
          loaders: fabric neoforge
          environment: server? | client?
          files: build/libs/notenoughpalette-*.jar
